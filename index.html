<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Software Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #090d16;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 40px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #1e293b;
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .links a {
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            padding: 10px 18px;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin: 6px;
        }
        .links a:hover {
            background: #38bdf8;
            color: #090d16;
        }
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">OFFICIAL DEVELOPER PORTAL</div>
        <h1>Sunrise Software Lab</h1>
        <p>Premium mobile games & utility applications engineered with performance, responsiveness, and user experience in mind.</p>
        <div class="links">
            <a href="/app-ads.txt">Authorized Sellers (app-ads.txt)</a>
            <a href="https://play.google.com/store/apps/dev?id=7933923307613585099" target="_blank">Google Play Store</a>
        </div>
        <footer>&copy; 2026 Sunrise Software Lab. All rights reserved.</footer>
    </div>
</body>
</html>
